spring:
  application:
    name: database-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  flyway:
    url: ${flyway-url:jdbc:postgresql://${database.host}:${database.port}/${database.name}}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: on

database:
  host: ${database-host:localhost}
  port: ${database-port:5432}
  name: ${database-name:dummyName}
  username: ${database-user:dummyUser}
  password: ${database-password:dummyPassword}
  pool:
    # this service's share of the 22 backend connections the managed database allows
    # (heating 4 / database 4 / water 4 / presence 2, 8 free). 6 up to and including 0.8.0: a
    # rollout starts the new pod next to the old one, so the pool counts twice and Flyway opens
    # one more connection over JDBC - 23 with every pool full, 19 with this value (HAS-169).
    # The price: short bursts did grow the old pool to 6, and now wait for a connection
    # instead. Not to be dropped as "equal to the library default" - the default may change
    max-size: 4

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform — and kept in the shared
      # document, where the paths can be exercised locally on 8005 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace
#    io.r2dbc.postgresql.PARAM: DEBUG

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 6005
management:
  server:
    port: 8005

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

---

spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
